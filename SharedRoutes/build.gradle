plugins {
    id 'java-library'
}

// SharedRoutes is plain Java (no Android), so it can be used by both:
//   - TeamCode        (the robot)         -> implementation project(':SharedRoutes')
//   - MeepMeepTesting (the desktop viewer) -> implementation project(':SharedRoutes')
//
// Nothing in here may use Android or FTC SDK classes (RobotLog, hardwareMap, MecanumBot, ...).
// Code that needs the robot goes in TeamCode's RobotRoute; the MeepMeep version goes in
// MeepMeepTesting's MeepMeepRoute.

java {
    // TeamCode compiles at Java 8, so this module must too.
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.brott.dev/' } // Road Runner
}

dependencies {
    api 'com.acmerobotics.roadrunner:core:0.5.4'
}
