plugins {
    id 'java-library'
}

// Stand-ins for the few FTC SDK classes that the shared code (SharedRoutes) uses, so it can
// also run in MeepMeep, which has no FTC SDK.
//   - SharedRoutes compiles against these (compileOnly), but does not include them.
//   - On the robot, the real FTC SDK classes are used instead.
//   - MeepMeepTesting includes these, so in MeepMeep RobotLog.dd(...) prints to the console.
//
// Every class and method in here must exist, with exactly the same signature, in the real
// FTC SDK.  Otherwise the shared code compiles but crashes on the robot.

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}
