plugins {
    id 'java'
    id 'application'
}

// MeepMeepTesting is a plain Java desktop app (no Android) for visualizing
// Road Runner trajectories on the field.  Run it with the MeepMeepTesting run
// configuration in Android Studio, or from the repo root:
//   ./gradlew :MeepMeepTesting:run
//
// The routes themselves are NOT in this module: they live in SharedCode and are
// the exact same files the robot runs.  Only RouteRunner (what each function
// does in MeepMeep) and MeepMeepTesting (which route to show) live here.

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'com.example.meepmeeptesting.MeepMeepTesting'
}

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://maven.brott.dev/' }
}

dependencies {
    implementation project(':SharedCode')
    implementation project(':FtcStandIns')   // RobotLog prints to the console
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'com.acmerobotics.roadrunner:core:0.5.4'
    implementation 'com.github.rh-robotics:MeepMeep:v1.1.1'
}
