plugins {
    id 'java'
    id 'application'
}

// MeepMeepTesting is a plain Java desktop app (no Android) for visualizing
// Road Runner trajectories on the field.  Run it with:
//   ./gradlew :MeepMeepTesting:run          (from the repo root, needs Android SDK configured)
//   cd MeepMeepTesting && ../gradlew run    (standalone, only needs a JDK 17+)

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'com.example.meepmeeptesting.MeepMeepTesting'
}

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://maven.brott.dev/' }
}

dependencies {
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'com.acmerobotics.roadrunner:core:0.5.4'
    implementation 'com.github.rh-robotics:MeepMeep:v1.1.1'
}
